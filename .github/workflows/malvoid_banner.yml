name: Generate Banner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate banner.svg
        run: |
          cat > malvoid_banner.svg << 'EOF'
          <svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
         <linearGradient id="grad" x1="0" x2="1">
         <stop offset="0%" stop-color="#22d3ee"/>
         <stop offset="50%" stop-color="#8b5cf6"/>
         <stop offset="100%" stop-color="#ec4899"/>
         </linearGradient>

         <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
         <path d="M60 0 H0 V60" fill="none" stroke="#1e293b" stroke-width="1"/>
         </pattern>

         <pattern id="dots" width="120" height="80" patternUnits="userSpaceOnUse">
         <circle cx="20" cy="20" r="1.5" fill="#475569"/>
         <circle cx="90" cy="50" r="1.5" fill="#334155"/>
         </pattern>

         <filter id="glow">
         <feGaussianBlur stdDeviation="10" result="b"/>
         <feMerge>
         <feMergeNode in="b"/>
         <feMergeNode in="SourceGraphic"/>
         </feMerge>
         </filter>

         <filter id="glitch">
         <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" result="n"/>
         <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
         </filter>

         <radialGradient id="ring" cx="50%" cy="50%" r="50%">
         <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
         <stop offset="70%" stop-color="rgba(255,255,255,0.08)"/>
         <stop offset="80%" stop-color="rgba(255,255,255,0)"/>
         </radialGradient>
         </defs>

         <rect width="1200" height="300" fill="#020617"/>
         <rect width="1200" height="300" fill="url(#grid)"/>
         <rect width="1200" height="300" fill="url(#dots)"/>

         <circle cx="600" cy="150" r="180" fill="url(#ring)">
         <animateTransform attributeName="transform" type="rotate"
         from="0 600 150" to="360 600 150" dur="12s" repeatCount="indefinite"/>
         </circle>

         <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle"
         font-size="100" fill="#22d3ee" opacity="0.25" font-family="monospace"
         filter="url(#glitch)">
         MALVOID
         </text>

         <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle"
         font-size="96" fill="url(#grad)" font-family="monospace" filter="url(#glow)">
         MALVOID
         <animate attributeName="letter-spacing" values="2;6;2" dur="4s" repeatCount="indefinite"/>
         </text>

         <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle"
         font-size="24" fill="#c7d2fe" font-family="monospace">
         [ STATIC MALWARE ANALYSIS TOOL ]
         </text>
         </svg>
         EOF

      - name: Commit banner
        run: |
          git config user.name "malvoid-bot"
          git config user.email "bot@malvoid.local"
          git add malvoid_banner.svg
          git commit -m "Auto-generate malvoid_banner.svg" || echo "No changes"
          git push

